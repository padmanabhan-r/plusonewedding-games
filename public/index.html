<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PlusOne Wedding</title>
<meta name="description" content="Wedding-chaos browser games. Pick one and play: run up the aisle, or serve the wedding feast.">
<meta name="theme-color" content="#1a0e22">
<meta property="og:type" content="website">
<meta property="og:url" content="https://plusonewedding.site/">
<meta property="og:title" content="PlusOne Wedding">
<meta property="og:description" content="Wedding-chaos browser games. Pick one and play.">
<meta property="og:image" content="https://plusonewedding.site/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://plusonewedding.site/og.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/home.css">
</head>
<body>
<!-- Studio splash: shown once per browser session, then the picker. -->
<div class="splash" id="splash" role="status" aria-label="Loading">
  <div class="splash-inner">
    <p class="studio">Devs on Crack</p>
    <p class="presents">presents</p>
    <div class="loadbar" aria-hidden="true"><span></span></div>
  </div>
</div>
<script>
  // Seen it this session (say, back from a game via the home button)? Skip straight to the picker.
  try { if (sessionStorage.getItem('splash-seen') === '1') document.getElementById('splash').remove(); } catch (e) {}
</script>
<noscript><style>.splash { display: none; }</style></noscript>
<div class="home-app">
  <header class="masthead">
    <h1>PlusOne Wedding</h1>
    <p>Pick a game.</p>
  </header>

  <!-- One card per game. To add a game: put it in public/games/<slug>/ with its own
       index.html and a 336x336 thumb.png, then add a card here. -->
  <main class="games">
    <a class="game" href="/games/aisle-run/" data-best="aisle-best" style="--frame: #4a2a5e">
      <img class="shot" src="/games/aisle-run/thumb.png" width="336" height="336" alt="">
      <span class="info">
        <b class="name">Aisle Run</b>
        <span class="hook">Collect every RSVP, dodge the relatives, then run up the aisle.</span>
        <span class="foot"><span class="play">Play</span><span class="best" hidden></span></span>
      </span>
    </a>
    <a class="game" href="/games/wedding-feast/" data-best="feast-best" style="--frame: #7a4a10">
      <img class="shot" src="/games/wedding-feast/thumb.png" width="336" height="336" alt="">
      <span class="info">
        <b class="name">Wedding Feast</b>
        <span class="hook">Serve every guest the right dish before they turn hangry.</span>
        <span class="foot"><span class="play">Play</span><span class="best" hidden></span></span>
      </span>
    </a>
  </main>
</div>
<script>
// Splash: hold until fonts and thumbnails are ready (at least 1.8s, at most 4s), then fade to the picker.
(() => {
  const splash = document.getElementById('splash'); if (!splash) return;
  try { sessionStorage.setItem('splash-seen', '1'); } catch (e) {}
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const assets = Promise.all([document.fonts ? document.fonts.ready : null, ...[...document.images].map(i => i.decode ? i.decode().catch(() => {}) : null)]);
  let gone = false;
  const done = () => { if (gone) return; gone = true; splash.classList.add('done'); setTimeout(() => splash.remove(), reduce ? 0 : 450); };
  Promise.race([Promise.all([assets, wait(reduce ? 500 : 1800)]), wait(4000)]).then(done);
  splash.addEventListener('click', done);
  addEventListener('keydown', done, { once: true });
})();
</script>
<script>
// Show this browser's best score on each card. Each game keeps its own best in localStorage.
document.querySelectorAll('.game[data-best]').forEach(card => {
  let best = 0;
  try { best = parseInt(localStorage.getItem(card.dataset.best), 10) || 0; } catch (e) {}
  if (best > 0) {
    const el = card.querySelector('.best');
    el.textContent = 'Your best ' + best.toLocaleString('en-IN');
    el.hidden = false;
  }
});
</script>
</body>
</html>
