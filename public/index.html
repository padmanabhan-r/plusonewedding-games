<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PlusOne Wedding</title>
<meta name="description" content="Wedding-chaos browser games. Pick one and play: run up the aisle, or serve the wedding feast.">
<meta name="theme-color" content="#1a0e22">
<meta property="og:type" content="website">
<meta property="og:url" content="https://plusonewedding.site/">
<meta property="og:title" content="PlusOne Wedding">
<meta property="og:description" content="Wedding-chaos browser games. Pick one and play.">
<meta property="og:image" content="https://plusonewedding.site/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://plusonewedding.site/og.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/home.css">
</head>
<body>
<div class="home-app">
  <header class="masthead">
    <h1>PlusOne Wedding</h1>
    <p>Pick a game.</p>
  </header>

  <!-- One card per game. To add a game: put it in public/games/<slug>/ with its own
       index.html and a 336x336 thumb.png, then add a card here. -->
  <main class="games">
    <a class="game" href="/games/aisle-run/" data-best="aisle-best" style="--frame: #4a2a5e">
      <img class="shot" src="/games/aisle-run/thumb.png" width="336" height="336" alt="">
      <span class="info">
        <b class="name">Aisle Run</b>
        <span class="hook">Collect every RSVP, dodge the relatives, then run up the aisle.</span>
        <span class="foot"><span class="play">Play</span><span class="best" hidden></span></span>
      </span>
    </a>
    <a class="game" href="/games/wedding-feast/" data-best="feast-best" style="--frame: #7a4a10">
      <img class="shot" src="/games/wedding-feast/thumb.png" width="336" height="336" alt="">
      <span class="info">
        <b class="name">Wedding Feast</b>
        <span class="hook">Serve every guest the right dish before they turn hangry.</span>
        <span class="foot"><span class="play">Play</span><span class="best" hidden></span></span>
      </span>
    </a>
  </main>
</div>
<script>
// Show this browser's best score on each card. Each game keeps its own best in localStorage.
document.querySelectorAll('.game[data-best]').forEach(card => {
  let best = 0;
  try { best = parseInt(localStorage.getItem(card.dataset.best), 10) || 0; } catch (e) {}
  if (best > 0) {
    const el = card.querySelector('.best');
    el.textContent = 'Your best ' + best.toLocaleString('en-IN');
    el.hidden = false;
  }
});
</script>
</body>
</html>
